<script>
  // Apni Google Gemini API Key yahan paste karein
  const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE";

  let imgBase64 = null;
  let imgMime = null;

  function showTab(tabId) {
    document.querySelectorAll('section.tab').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');
  }

  // CHATBOT
  async function handleSend() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    appendMsg('user', text);
    input.value = '';
    const loading = appendMsg('ai', 'TITAN is evaluating PECA 2016 law & analyzing query...');

    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: "You are TITAN Cyber Guardian, a legal and technical expert on Pakistani cybercrime laws (PECA 2016). Answer the user accurately:\n" + text }] }]
        })
      });
      const data = await res.json();
      loading.remove();
      const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response generated.';
      appendMsg('ai', reply);
    } catch (e) {
      loading.remove();
      appendMsg('ai', 'Connection error: ' + e.message);
    }
  }

  function appendMsg(sender, text) {
    const log = document.getElementById('chatLog');
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    div.innerHTML = `<span class="tag">${sender === 'ai' ? 'TITAN Guardian' : 'You'}</span>${text}`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  // MEDIA VISION DETECTION
  function fileChosen(input) {
    const file = input.files[0];
    if (!file) return;

    document.getElementById('fileInfo').innerText = "Selected: " + file.name;
    document.getElementById('scanBtn').style.display = 'inline-block';

    const reader = new FileReader();
    reader.onload = function () {
      imgBase64 = reader.result.split(',')[1];
      imgMime = file.type;
    };
    reader.readAsDataURL(file);
  }

  async function runMediaScan() {
    const out = document.getElementById('scanOutput');
    if (!imgBase64) return;

    out.style.display = 'block';
    out.innerHTML = "<b>Scanning image via Gemini Vision API for digital manipulation...</b>";

    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: "Analyze this image for cybercrime evidence, fake payment receipt signatures, screenshot editing, or digital manipulation under PECA 2016." },
              { inline_data: { mime_type: imgMime, data: imgBase64 } }
            ]
          }]
        })
      });
      const data = await res.json();
      const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Analysis completed, no major threat markers found.";
      out.innerHTML = `<b>Analysis Verdict:</b><br><div style="margin-top:8px; white-space:pre-wrap;">${reply}</div>`;
    } catch (e) {
      out.innerHTML = "<span style='color:var(--risk);'>Error analyzing image. Please check API Key.</span>";
    }
  }
</script>
